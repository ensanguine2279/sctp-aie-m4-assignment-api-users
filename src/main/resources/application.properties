spring.application.name=user-service

# Render's default port is 10000, but you can override it by setting the PORT environment variable.
server.port=${APP_PORT:8080}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:userdb}
# For WSL use: postgres
# For Mac use: your Mac username
spring.datasource.username=${DB_USER:postgres}
# Leave blank if authentication is set to trust in pg_hba.conf
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA / Hibernate Settings
# ⚠️ WARNING: 'create' drops and recreates ALL tables on every startup — all existing data will be lost.
# This is acceptable during early development, but switch to 'update' as soon as you want to keep your data.
spring.jpa.hibernate.ddl-auto=create
# Use this instead when you want to keep existing data:
# spring.jpa.hibernate.ddl-auto=update
# In production, use a migration tool like Flyway or Liquibase instead of ddl-auto.spring.jpa.show-sql=false
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# Generate the JWT secret with: openssl rand -base64 48
#jwt.secret=r7rV1khO40qvqiUeMLnAlaSFk5aWj6vapTrStZ92X6AmZpKxlDCYDaaIqNGrBeJWw
jwt.secret=${JWT_SECRET:test-secret-key-that-is-at-least-32-bytes-long}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

app.seed-admin.username=${ADMIN_USERNAME:admin01}
app.seed-admin.password=${ADMIN_PASSWORD:abcd1234}




