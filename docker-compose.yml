services:
  # ----------------------------------------------------
  # 1. Dedicated PostgreSQL Database for User Service
  # ----------------------------------------------------
  user-db:
    image: postgres:16-alpine
    container_name: user-db
    environment:
      POSTGRES_DB: ${DB_NAME_ENV}
      POSTGRES_USER: ${DB_USER_ENV}
      POSTGRES_PASSWORD: ${DB_PASSWORD_ENV}
    ports:
      - "${DB_HOST_PORT_ENV:-5422}:5432" # Host:Container port mapping
    volumes:
      - user_db_data:/var/lib/postgresql/data # Persistent storage
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER_ENV} -d ${DB_NAME_ENV}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - users-network

  # ----------------------------------------------------
  # 2. User Microservice Application
  # ----------------------------------------------------
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: ensanguine/user-service:1.0.0
    container_name: user-service
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}" # Ensures the container runs with the same UID and GID as the host user
    ports:
      - "${APP_PORT_ENV:-8022}:${APP_PORT_ENV:-8022}"
    environment:
      - APP_PORT=${APP_PORT_ENV}
      - DB_HOST=${DB_HOST_ENV}
      - DB_PORT=5432
      - DB_NAME=${DB_NAME_ENV}
      - DB_USER=${DB_USER_ENV}
      - DB_PASSWORD=${DB_PASSWORD_ENV}
      - JWT_PRIVATE_KEY_PATH=/run/secrets/jwt_private_key # Path inside the container 
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS_ENV}
      - JWT_ISSUER=${JWT_ISSUER_ENV}
      - JWT_AUDIENCE=${JWT_AUDIENCE_ENV}
      - ADMIN_USERNAME=${ADMIN_USERNAME_ENV}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD_ENV}
    secrets:
      - jwt_private_key
    depends_on:
      user-db:
        condition: service_healthy # Waits for DB healthcheck to pass before booting Spring Boot
    networks:
      - users-network

# ----------------------------------------------------
# 3. Secrets Management for JWT Private Key
# ----------------------------------------------------
secrets:
  jwt_private_key:
    file: ${JWT_PRIVATE_KEY_FILE:-${HOME}/.taskflow/keys/private.pem}

# ----------------------------------------------------
# 4. Shared Infrastructure (Network & Storage)
# ----------------------------------------------------
networks:
  users-network:
    name: users-network
    driver: bridge

volumes:
  user_db_data: